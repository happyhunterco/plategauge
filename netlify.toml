# One Netlify site for the web app + API.
# Base directory: repository root. The API-only site config in server/netlify.toml still works on its own.
[build]
  command = "npm run build:web"
  publish = "dist"
  functions = "server/netlify/functions"
  edge_functions = "server/netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Classic Netlify handlers do not declare v2 route configs, so keep their public
# URLs explicit and stable for the app and Stripe webhook configuration.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/subscription-status"
  to = "/.netlify/functions/subscription-status"
  status = 200

[[redirects]]
  from = "/api/billing-portal"
  to = "/.netlify/functions/billing-portal"
  status = 200

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# Single-page app: every non-API route serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

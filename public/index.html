<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Calorie and macro tracker. Tell it what you’re hungry for and see how to make it fit." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PlateGauge" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>PlateGauge</title>
    <style>
      html, body { height: 100%; margin: 0; background: #fff; }
      body { overflow: hidden; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>PlateGauge needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) {
        addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    </script>
  </body>
</html>

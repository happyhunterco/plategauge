<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      input:focus, textarea:focus { outline: none !important; box-shadow: none !important; caret-color: #0A84FF; }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Vahla brings personalized nutrition, workouts, and daily progress together." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vahla" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico?v=vahla-2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Vahla</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #fff; }
      body { overflow: hidden; overscroll-behavior: none; }
      #root { display: flex; flex: 1; position: relative; z-index: 1; isolation: isolate; }
      /* Keep the iOS standalone status area opaque instead of showing Safari's glass blur. */
      body::before {
        content: '';
        position: fixed;
        z-index: 2147483647;
        pointer-events: none;
        top: 0;
        right: 0;
        left: 0;
        height: env(safe-area-inset-top, 0px);
        background: #fff;
        transform: translateZ(0);
      }
    </style>
  </head>
  <body>
    <noscript>Vahla needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) {
        addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    </script>
  </body>
</html>
